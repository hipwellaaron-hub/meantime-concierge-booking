<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<link rel="manifest" href="/floor/manifest.json">
<title>Meantime Floor</title>
<style>
  :root {
    --bg: #141210; --surface: #1d1a16; --surface-hi: #24201b;
    --border: #2e2a24; --border-bright: #3d372f;
    --cream: #f2ead9; --muted: #9a917f;
    --gold: #c9a96e; --gold-dim: #8a7550;
    --green: #3f9d5e; --red: #cf4e35;
    --font-head: Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--cream); font-family: var(--font-body); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 90px; }

  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 10px; text-align: center;
    border-bottom: 1px solid var(--border); }
  header.top h1 { font-family: var(--font-head); font-size: 1.3rem; color: var(--gold); }
  header.top .sub { font-size: 0.75rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 12px 0; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-bright);
    background: var(--surface-hi); color: var(--cream); font-size: 1rem; }
  button.primary { width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 10px;
    background: var(--gold); color: #201a10; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
  .error { color: var(--red); font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }

  .tabs { display: flex; gap: 8px; margin: 12px 0; }
  .tabs button { flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--border-bright);
    background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--surface-hi); color: var(--gold); border-color: var(--gold-dim); }

  .event-card { display: block; width: 100%; text-align: left; background: var(--surface); color: var(--cream);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 10px 0; cursor: pointer; }
  .event-card .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .event-card .name { font-weight: 700; }
  .event-card .meta { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
  .badges { display: flex; gap: 6px; flex-shrink: 0; }
  .pill { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 999px; }
  .pill.paid { background: rgba(63,157,94,0.18); color: var(--green); border: 1px solid var(--green); }
  .pill.owing { background: rgba(207,78,53,0.18); color: var(--red); border: 1px solid var(--red); }
  .pill.beo { background: rgba(201,169,110,0.14); color: var(--gold); border: 1px solid var(--gold-dim); }

  .cal-head { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; }
  .cal-head .month { font-family: var(--font-head); font-size: 1.05rem; }
  .cal-head button { background: transparent; border: 1px solid var(--border-bright); color: var(--cream);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 0.62rem; color: var(--muted); padding: 4px 0; }
  .cal-day { position: relative; min-height: 46px; border: 1px solid var(--border); border-radius: 7px;
    padding: 3px 4px; font-size: 0.72rem; color: var(--muted); background: var(--surface); cursor: pointer; }
  .cal-day.closed { opacity: 0.32; background: transparent; cursor: default; }
  .cal-day.other { visibility: hidden; }
  .cal-day.today { border-color: var(--gold); }
  .cal-day .dots { position: absolute; bottom: 4px; left: 4px; right: 4px; display: flex; gap: 3px; flex-wrap: wrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.paid { background: var(--green); }
  .dot.owing { background: var(--red); }
  .cal-legend { font-size: 0.7rem; color: var(--muted); margin-top: 8px; display: flex; gap: 14px; }
  .cal-legend .dot { display: inline-block; vertical-align: middle; margin-right: 4px; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-end; z-index: 20; }
  .sheet-inner { background: var(--surface-hi); width: 100%; max-width: 560px; margin: 0 auto;
    border-radius: 16px 16px 0 0; padding: 18px; max-height: 86vh; overflow-y: auto; }
  .sheet-inner h2 { font-family: var(--font-head); margin-bottom: 2px; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border);
    font-size: 0.9rem; }
  .kv .k { color: var(--muted); }
  .sheet-close { margin-top: 14px; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-bright);
    background: transparent; color: var(--cream); cursor: pointer; }

  .beo-frame { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
  .beo-bar { display: flex; gap: 8px; padding: 10px 14px; background: var(--surface-hi); border-bottom: 1px solid var(--border); }
  .beo-bar button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border-bright);
    background: transparent; color: var(--cream); cursor: pointer; }
  .beo-bar .dl { border-color: var(--gold-dim); color: var(--gold); }
  .beo-frame iframe { flex: 1; border: none; background: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 26px 0; }
  .refresh-hint { text-align: center; font-size: 0.7rem; color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<header class="top">
  <h1>Meantime Floor</h1>
  <div class="sub">Meantime Hamilton</div>
</header>
<div class="wrap" id="root"></div>

<script>
(function () {
  "use strict";
  var root = document.getElementById("root");
  var TOKEN_KEY = "floor_token";
  var state = { view: "upcoming", monthCursor: null, bookings: [], name: null };

  function token() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, { "Authorization": "Bearer " + token() });
    return fetch("/api/staff" + path, options).then(function (resp) {
      if (resp.status === 401) { setToken(null); renderLogin(); throw new Error("logged out"); }
      return resp;
    });
  }

  // ---- LOGIN ----
  function renderLogin(message) {
    root.innerHTML =
      '<div class="card" style="margin-top:26px;">' +
      '<h2 style="font-family:var(--font-head); margin-bottom:4px;">Staff sign in</h2>' +
      '<p style="color:var(--muted); font-size:0.85rem;">Read-only. What\'s on, and who\'s paid.</p>' +
      '<form id="login-form">' +
      '<label>Email</label><input type="email" id="f-email" required autocomplete="username">' +
      '<label>Password</label><input type="password" id="f-password" required autocomplete="current-password">' +
      '<button class="primary" type="submit">Sign in</button>' +
      '<div class="error" id="login-error">' + (message || "") + "</div>" +
      "</form></div>";
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      fetch("/api/staff/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("f-email").value, password: document.getElementById("f-password").value })
      }).then(function (resp) {
        if (!resp.ok) return resp.json().then(function (d) { throw new Error(d.detail || "Sign in failed"); });
        return resp.json();
      }).then(function (data) {
        setToken(data.token);
        state.name = data.name;
        loadAndRender();
      }).catch(function (err) {
        document.getElementById("login-error").textContent = err.message;
      });
    });
  }

  // ---- DATA ----
  function monthRange(cursor) {
    var first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    var last = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    return { from: iso(first), to: iso(last) };
  }

  function loadAndRender() {
    // One fetch covers both views: today forward ~90 days for Upcoming,
    // plus the visible calendar month.
    var today = new Date();
    state.monthCursor = state.monthCursor || new Date(today.getFullYear(), today.getMonth(), 1);
    var range = monthRange(state.monthCursor);
    var from = range.from < isoToday() ? range.from : isoToday();
    var horizon = new Date(today.getTime() + 90 * 86400000);
    var to = range.to > isoOf(horizon) ? range.to : isoOf(horizon);
    api("/bookings?from=" + from + "&to=" + to).then(function (resp) { return resp.json(); }).then(function (data) {
      state.bookings = data.bookings;
      renderApp();
    }).catch(function () {});
  }

  function isoOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isoToday() { return isoOf(new Date()); }
  function displayDate(iso) { var p = iso.split("-"); return p[2] + "-" + p[1] + "-" + p[0]; }
  function time12(hm) {
    if (!hm) return "";
    var h = parseInt(hm.slice(0, 2), 10), m = hm.slice(3, 5);
    var suffix = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
    return h + ":" + m + suffix;
  }

  // ---- APP SHELL ----
  function renderApp() {
    root.innerHTML =
      '<div class="tabs">' +
      '<button id="tab-upcoming" class="' + (state.view === "upcoming" ? "active" : "") + '">Upcoming</button>' +
      '<button id="tab-calendar" class="' + (state.view === "calendar" ? "active" : "") + '">Calendar</button>' +
      "</div>" +
      '<div id="view"></div>' +
      '<div class="refresh-hint">Pull down or reopen the app to refresh &middot; <a href="#" id="logout" style="color:var(--muted);">sign out</a></div>';
    document.getElementById("tab-upcoming").addEventListener("click", function () { state.view = "upcoming"; renderApp(); });
    document.getElementById("tab-calendar").addEventListener("click", function () { state.view = "calendar"; renderApp(); });
    document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); setToken(null); renderLogin(); });
    if (state.view === "upcoming") renderUpcoming(); else renderCalendar();
  }

  function badgeHtml(b) {
    return '<div class="badges">' +
      (b.beo_ready ? '<span class="pill beo">BEO</span>' : "") +
      (b.payment_status === "paid" ? '<span class="pill paid">PAID</span>' : '<span class="pill owing">OWING</span>') +
      "</div>";
  }

  function eventCard(b) {
    var card = document.createElement("button");
    card.className = "event-card";
    card.innerHTML =
      '<div class="row1"><span class="name">' + b.event_name + "</span>" + badgeHtml(b) + "</div>" +
      '<div class="meta">' + displayDate(b.date) + " · " + b.spaces.join(" + ") + " · " +
      time12(b.start_time) + "–" + time12(b.end_time) + " · " + b.adults + " adults" +
      (b.kids ? ", " + b.kids + " kids" : "") + "</div>";
    card.addEventListener("click", function () { openDetail(b); });
    return card;
  }

  // ---- UPCOMING ----
  function renderUpcoming() {
    var view = document.getElementById("view");
    view.innerHTML = "";
    var today = isoToday();
    var upcoming = state.bookings.filter(function (b) { return b.date >= today; });
    if (!upcoming.length) { view.innerHTML = '<div class="empty">No upcoming functions.</div>'; return; }
    upcoming.forEach(function (b) { view.appendChild(eventCard(b)); });
  }

  // ---- CALENDAR ----
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function renderCalendar() {
    var view = document.getElementById("view");
    var cursor = state.monthCursor;
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var byDate = {};
    state.bookings.forEach(function (b) { (byDate[b.date] = byDate[b.date] || []).push(b); });

    var html = '<div class="cal-head">' +
      '<button id="cal-prev">&larr;</button>' +
      '<span class="month">' + MONTHS[month] + " " + year + "</span>" +
      '<button id="cal-next">&rarr;</button></div>' +
      '<div class="cal-grid">';
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) { html += '<div class="cal-dow">' + d + "</div>"; });

    var first = new Date(year, month, 1);
    var lead = (first.getDay() + 6) % 7;  // Monday-first grid
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < lead; i++) html += '<div class="cal-day other"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var date = new Date(year, month, day);
      var iso = isoOf(date);
      var dow = date.getDay();
      var closed = dow === 1 || dow === 2;  // Mondays and Tuesdays: venue closed
      var events = byDate[iso] || [];
      var dots = events.map(function (b) {
        return '<span class="dot ' + (b.payment_status === "paid" ? "paid" : "owing") + '"></span>';
      }).join("");
      html += '<div class="cal-day' + (closed ? " closed" : "") + (iso === isoToday() ? " today" : "") + '" data-date="' + iso + '">' +
        day + '<div class="dots">' + dots + "</div></div>";
    }
    html += "</div>" +
      '<div class="cal-legend"><span><span class="dot paid"></span>Paid</span>' +
      '<span><span class="dot owing"></span>Owing</span><span>Mon &amp; Tue closed</span></div>' +
      '<div id="cal-day-events"></div>';
    view.innerHTML = html;

    document.getElementById("cal-prev").addEventListener("click", function () {
      state.monthCursor = new Date(year, month - 1, 1); loadAndRender(); state.view = "calendar";
    });
    document.getElementById("cal-next").addEventListener("click", function () {
      state.monthCursor = new Date(year, month + 1, 1); loadAndRender(); state.view = "calendar";
    });
    view.querySelectorAll(".cal-day[data-date]").forEach(function (cell) {
      cell.addEventListener("click", function () {
        var events = byDate[cell.getAttribute("data-date")] || [];
        var box = document.getElementById("cal-day-events");
        box.innerHTML = events.length ? "" : '<div class="empty">Nothing booked this day.</div>';
        events.forEach(function (b) { box.appendChild(eventCard(b)); });
      });
    });
  }

  // ---- DETAIL SHEET ----
  function openDetail(summary) {
    api("/bookings/" + summary.id).then(function (r) { return r.json(); }).then(function (b) {
      var sheet = document.createElement("div");
      sheet.className = "sheet";
      function kv(k, v) { return v ? '<div class="kv"><span class="k">' + k + "</span><span>" + v + "</span></div>" : ""; }
      sheet.innerHTML =
        '<div class="sheet-inner">' +
        '<h2>' + b.event_name + "</h2>" +
        '<div style="margin:4px 0 10px;">' + badgeHtml(b) + "</div>" +
        kv("Date", displayDate(b.date)) +
        kv("Space", b.spaces.join(" + ")) +
        kv("Type", b.event_type) +
        kv("Event", time12(b.start_time) + " – " + time12(b.end_time)) +
        kv("Guests", b.adults + " adults" + (b.kids ? ", " + b.kids + " kids" : "")) +
        kv("Setup access", b.setup_access_time ? time12(b.setup_access_time) + (b.setup_access_confirmed ? " (confirmed)" : " (requested)") : null) +
        kv("Guests arrive", b.guest_arrival_time ? time12(b.guest_arrival_time) : null) +
        kv("Food service", b.food_service_time ? time12(b.food_service_time) : null) +
        (b.beo_ready ? '<button class="primary" id="open-beo" style="margin-top:16px;">Open BEO</button>' :
          '<div class="empty" style="padding:14px 0 0;">BEO not finalised yet.</div>') +
        '<button class="sheet-close" id="sheet-close">Close</button>' +
        "</div>";
      document.body.appendChild(sheet);
      sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.remove(); });
      document.getElementById("sheet-close").addEventListener("click", function () { sheet.remove(); });
      var beoBtn = document.getElementById("open-beo");
      if (beoBtn) beoBtn.addEventListener("click", function () { openBeo(b); });
    }).catch(function () {});
  }

  // ---- BEO VIEWER ----
  function openBeo(b) {
    api("/bookings/" + b.id + "/beo").then(function (r) { return r.text(); }).then(function (html) {
      var frame = document.createElement("div");
      frame.className = "beo-frame";
      frame.innerHTML =
        '<div class="beo-bar">' +
        '<button id="beo-back">&larr; Back</button>' +
        '<button class="dl" id="beo-pdf">Download PDF</button>' +
        "</div><iframe></iframe>";
      document.body.appendChild(frame);
      frame.querySelector("iframe").srcdoc = html;
      document.getElementById("beo-back").addEventListener("click", function () { frame.remove(); });
      document.getElementById("beo-pdf").addEventListener("click", function () {
        api("/bookings/" + b.id + "/beo.pdf").then(function (r) { return r.blob(); }).then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = b.event_name.replace(/[^a-z0-9]+/gi, "-") + "-BEO.pdf";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        });
      });
    }).catch(function () {});
  }

  // ---- BOOT ----
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/floor/sw.js", { scope: "/floor" }).catch(function () {});
  }
  if (token()) { loadAndRender(); } else { renderLogin(); }
})();
</script>
</body>
</html>
