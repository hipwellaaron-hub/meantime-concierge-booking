<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquire — Meantime Hamilton</title>
{% include "_tracking_head.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface-hi: #1e1e1e;
    --gold: #c9a96e;
    --gold-dim: #a08350;
    --cream: #f5f0e8;
    --muted: #8a8580;
    --border: rgba(201,169,110,0.15);
    --border-bright: rgba(201,169,110,0.35);
    --radius: 14px;
    --font-head: "Playfair Display", Georgia, serif;
    --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 80px; }
  .brand { font-family: var(--font-head); font-size: 1.8rem; font-weight: 700; margin: 0 0 6px; }
  .venue-name { font-family: var(--font-head); font-size: 1.25rem; margin: 24px 0 2px; }
  .venue-tag { font-size: 0.78rem; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 22px;
  }
  .step-header { font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); margin: 0 0 20px; }

  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 6px; color: var(--cream); }
  label.first { margin-top: 0; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: var(--surface-hi);
    color: var(--cream);
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--border-bright); }
  textarea { min-height: 80px; resize: vertical; }
  .field-hint { font-size: 0.78rem; color: var(--muted); margin-top: 5px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; min-width: 0; }
  /* Below ~480px, a side-by-side pair like Event Name + Event Date
     squeezes the text field to under 120px -- too narrow to comfortably
     type an event name into on a phone. Stack instead of shrinking. */
  @media (max-width: 480px) {
    .field-row { flex-direction: column; gap: 0; }
  }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  button {
    padding: 13px 22px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--gold); color: #201a10; }
  .btn-primary:hover { background: var(--gold-dim); }
  .btn-secondary { background: transparent; border: 1px solid var(--border-bright) !important; color: var(--cream); }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<main>
  <p class="brand">meantime</p>
  <p class="venue-name">Meantime Hamilton</p>
  <p class="venue-tag">Hamilton</p>

  <form method="post" action="/enquiries" id="enquiry-form">
    <input type="hidden" name="attribution" id="attribution-field">
    <div class="card">
      <section id="step-1">
        <p class="step-header">1 · Your Details</p>

        <label class="first" for="first_name">First Name *</label>
        <input type="text" id="first_name" name="first_name" required maxlength="255">

        <label for="last_name">Last Name *</label>
        <input type="text" id="last_name" name="last_name" required maxlength="255">

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required maxlength="320">

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" maxlength="50">

        <label for="company_name">Company Name</label>
        <input type="text" id="company_name" name="company_name" maxlength="255">

        <div class="actions">
          <button type="button" class="btn-primary" id="btn-next">Next &gt;</button>
        </div>
      </section>

      <section id="step-2" hidden>
        <p class="step-header">2 · Event Details</p>

        <div class="field-row">
          <div>
            <label class="first" for="event_name">Event Name *</label>
            <input type="text" id="event_name" name="event_name" required maxlength="255">
          </div>
          <div>
            <label class="first" for="event_date">Event Date *</label>
            <input type="date" id="event_date" name="event_date" required>
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="attendee_count">Number Of Attendees *</label>
            <input type="number" id="attendee_count" name="attendee_count" min="1" max="5000" required>
          </div>
          <div>
            <label for="event_type">Event Type *</label>
            <select id="event_type" name="event_type" required>
              <option value="" disabled selected>Please select</option>
              {% for t in event_types %}
              <option value="{{ t }}">{{ t }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="adult_count">Number Of Adults</label>
            <input type="number" id="adult_count" name="adult_count" min="0" max="5000">
            <p class="field-hint">Only if you know it already -- we'll ask if not.</p>
          </div>
          <div>
            <label for="dates_flexible">Are Dates Flexible *</label>
            <select id="dates_flexible" name="dates_flexible" required>
              <option value="" disabled selected>Please select</option>
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>
        </div>

        <label for="proposed_time_slot">Proposed Time</label>
        <input type="text" id="proposed_time_slot" name="proposed_time_slot" maxlength="100" placeholder="i.e. 12:00 PM - 5:00 PM">

        <label for="comments">Comments to add to your inquiry</label>
        <textarea id="comments" name="comments" maxlength="5000"></textarea>

        <div class="actions">
          <button type="button" class="btn-secondary" id="btn-back">&lt; Back</button>
          <button type="submit" class="btn-primary">Submit Inquiry</button>
        </div>
      </section>
    </div>
  </form>
</main>

<script>
(function () {
  // Ad-attribution capture: UTM params, Google's gclid, Meta's fbclid, and
  // the raw referrer -- captured once at first landing and persisted in
  // localStorage so a visitor who browses the site and enquires later in
  // the session, or on a return visit, still has their original touch
  // attached rather than whatever happens to be in the URL at submit
  // time. See app.services.attribution for how this is classified and
  // stored server-side; nothing here decides anything, it only captures.
  var STORAGE_FIRST = "mtc_attribution_first";
  var STORAGE_LAST = "mtc_attribution_last";
  var UTM_AND_CLICK_ID_FIELDS = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "gbraid", "wbraid", "fbclid"];

  function readStorage(key) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null; // storage unavailable (private browsing, disabled) -- just no persistence this visit
    }
  }

  function writeStorage(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      // Never block the form over storage being unavailable.
    }
  }

  function captureTouch() {
    var params = new URLSearchParams(window.location.search);
    var touch = { referrer: document.referrer || null, captured_at: new Date().toISOString() };
    var hasSignal = false;
    UTM_AND_CLICK_ID_FIELDS.forEach(function (field) {
      var value = params.get(field);
      touch[field] = value;
      if (value) hasSignal = true;
    });
    if (!hasSignal && document.referrer) {
      try {
        hasSignal = new URL(document.referrer).origin !== window.location.origin;
      } catch (e) { /* malformed referrer -- ignore, hasSignal stays false */ }
    }
    return { touch: touch, hasSignal: hasSignal };
  }

  var captured = captureTouch();
  if (captured.hasSignal) {
    // A real fresh touch (a campaign link or an external referrer) --
    // always becomes the new last touch, and the first touch too if none
    // is recorded yet for this visitor.
    writeStorage(STORAGE_LAST, captured.touch);
    if (!readStorage(STORAGE_FIRST)) writeStorage(STORAGE_FIRST, captured.touch);
  } else {
    // Nothing to attribute on this particular load (a reload, or internal
    // navigation) -- never overwrite an existing touch with a blank one,
    // but a visitor with no history at all still gets an honest "unknown"
    // bundle rather than submitting with no attribution data at all.
    if (!readStorage(STORAGE_FIRST)) writeStorage(STORAGE_FIRST, captured.touch);
    if (!readStorage(STORAGE_LAST)) writeStorage(STORAGE_LAST, captured.touch);
  }

  var attributionField = document.getElementById("attribution-field");
  var attributionForm = document.getElementById("enquiry-form");
  if (attributionField && attributionForm) {
    attributionForm.addEventListener("submit", function () {
      attributionField.value = JSON.stringify({
        first_touch: readStorage(STORAGE_FIRST) || captured.touch,
        last_touch: readStorage(STORAGE_LAST) || captured.touch,
      });
    });
  }
})();
</script>
<script>
(function () {
  const form = document.getElementById("enquiry-form");
  const step1 = document.getElementById("step-1");
  const step2 = document.getElementById("step-2");
  // Required attributes are moved on/off with the active step rather than
  // relying on `hidden` to exempt a field from constraint validation --
  // that exemption isn't reliable across browsers, and a required field
  // hidden behind the other step must never silently block submission
  // with an unfocusable, unreportable validation error.
  const step2Required = Array.from(step2.querySelectorAll("[required]"));
  step2Required.forEach(function (el) { el.removeAttribute("required"); });

  document.getElementById("btn-next").addEventListener("click", function () {
    if (!form.reportValidity()) return;
    step1.hidden = true;
    step2.hidden = false;
    step2Required.forEach(function (el) { el.setAttribute("required", ""); });
    window.scrollTo(0, 0);
  });

  document.getElementById("btn-back").addEventListener("click", function () {
    step2.hidden = true;
    step1.hidden = false;
    step2Required.forEach(function (el) { el.removeAttribute("required"); });
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
