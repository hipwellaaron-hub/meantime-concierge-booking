<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Meantime Hamilton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --gold: #c9a96e;
    --cream: #f5f0e8;
    --muted: #8a8580;
    --border: rgba(201,169,110,0.15);
    --radius: 14px;
    --font-head: "Playfair Display", Georgia, serif;
    --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-body); background: var(--bg); color: var(--cream); -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 460px; margin: 24px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px 28px;
  }
  h1 { font-family: var(--font-head); font-size: 1.5rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 6px; }
  .reference { color: var(--gold); font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <h1>Thanks, {{ (booking.contact.name | person_name) if booking.contact else "" }}</h1>
  <p>Your enquiry for <strong style="color: var(--cream);">{{ booking.event_name }}</strong> has been received.</p>
  <p>Reference: <span class="reference">{{ booking.reference_code }}</span></p>
  <p>We'll be in touch shortly.</p>
</div>
</body>
</html>
