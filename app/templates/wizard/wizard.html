<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ booking.event_name }} — Event Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital@1&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface-hi: #1e1e1e;
    --gold: #c9a96e;
    --gold-dim: #a08350;
    --cream: #f5f0e8;
    --muted: #8a8580;
    --ember: #d4622b;
    --safe-green: #4a6b4a;
    --safe-green-text: #7ab87a;
    --wine: #7a2e3a;
    --border: rgba(201,169,110,0.15);
    --border-bright: rgba(201,169,110,0.35);
    --radius: 14px;
    --font-head: "Playfair Display", Georgia, serif;
    --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-quote: "Libre Baskerville", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface-hi);
    border-bottom: 1px solid var(--border);
    color: var(--cream);
    padding: 14px 18px 12px;
  }
  /* Centred, event-first: the event name is the headline, then space and
     date, then the reference last -- not a corner label that reads less
     prominent than its own booking code. */
  header.top .event-name { font-family: var(--font-head); font-size: 1.5rem; font-weight: 600; margin: 0 0 2px; text-align: center; }
  header.top .event-meta { font-size: 0.85rem; color: var(--muted); margin: 0 0 12px; text-align: center; }
  header.top .event-ref { font-size: 0.72rem; color: var(--muted); opacity: 0.8; }
  .progress-track { display: flex; gap: 4px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress-seg.done { background: var(--gold-dim); }
  .progress-seg.active { background: var(--ember); }
  .progress-label { font-size: 0.72rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.03em; text-transform: uppercase; }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  h2 { font-family: var(--font-head); margin: 0 0 6px; font-size: 1.35rem; color: var(--cream); font-weight: 600; }
  .step-intro { font-family: var(--font-quote); font-style: italic; color: var(--muted); font-size: 0.92rem; margin: 0 0 18px; line-height: 1.5; }

  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 6px; color: var(--cream); }
  label.first { margin-top: 0; }
  input[type=time], input[type=number], input[type=text], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: var(--surface-hi);
    color: var(--cream);
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--border-bright); }
  textarea { min-height: 72px; resize: vertical; }
  .field-hint { font-size: 0.78rem; color: var(--muted); margin-top: 5px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  .warning-banner, .info-banner, .escalation-banner {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.85rem;
    margin-top: 14px;
    line-height: 1.4;
  }
  .warning-banner { background: rgba(212,98,43,0.12); border: 1px solid var(--ember); color: #eeb08f; }
  .info-banner { background: rgba(201,169,110,0.10); border: 1px solid var(--gold-dim); color: var(--gold); }
  .vendor-card { border: 1px solid var(--border-bright); border-radius: 10px; padding: 14px; margin: 12px 0; }
  .vendor-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    font-weight: 700; color: var(--cream); }
  .vendor-card-head .btn-secondary { margin-top: 0; }
  .marker-chip { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--gold-dim); color: var(--gold);
    vertical-align: 2px; margin-left: 2px; }
  .marker-chip.peanut { border-color: var(--ember); color: var(--ember); }
  .check-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.92rem; cursor: pointer; }
  .check-row input { width: auto; margin: 0; }
  .btn-secondary { background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; margin-top: 6px; }
  .escalation-banner { background: rgba(122,46,58,0.20); border: 1px solid var(--wine); color: #e8b3bd; font-weight: 600; }

  .badge-gf {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: rgba(74,107,74,0.25); border: 1px solid var(--safe-green);
    color: var(--safe-green-text); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
  }

  /* Option cards (beverage structure, music type, cake choice) */
  .option-grid { display: grid; gap: 10px; }
  .option-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    background: var(--surface-hi);
  }
  .option-card.selected { border-color: var(--gold); background: rgba(201,169,110,0.08); }
  .option-card .opt-title { font-weight: 700; margin-bottom: 3px; color: var(--cream); }
  .option-card .opt-desc { font-size: 0.82rem; color: var(--muted); }
  .option-card-photo { display: flex; align-items: center; gap: 12px; }
  .layer-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .layer-pill {
    border: 1px solid var(--border-bright); background: transparent; color: var(--cream);
    border-radius: 999px; padding: 5px 11px; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .layer-pill.selected { border-color: var(--gold); background: rgba(201,169,110,0.18); color: var(--gold); }
  /* The card itself picks no size on its own -- only its pills do -- so it
     shouldn't look clickable the way a single-price option-card does. */
  .cake-group { cursor: default; }

  /* Food catalogue grid */
  .catalogue-section-title { font-family: var(--font-head); font-size: 0.95rem; letter-spacing: 0.02em; color: var(--gold); margin: 22px 0 10px; }
  .catalogue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .catalogue-photo {
    width: 96px; height: 96px; border-radius: 9px; flex-shrink: 0;
    object-fit: cover;
    border: 1px solid var(--border);
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  /* Doubles in place on hover/tap so guests on a small screen can actually
     see what a platter or cake looks like -- transform (not width/height)
     so it doesn't reflow the row, transform-origin keeps it growing away
     from the row's other content, and the z-index lift + shadow keep it
     readable on top of whatever it now overlaps. */
  .catalogue-photo:not(.placeholder):hover,
  .catalogue-photo:not(.placeholder):focus-visible {
    transform: scale(2);
    transform-origin: left center;
    z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  .catalogue-photo.placeholder {
    background: var(--surface-hi);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-dim); font-size: 0.65rem; font-weight: 700; text-align: center; line-height: 1.15;
    padding: 4px;
  }
  .catalogue-info { flex: 1; min-width: 0; }
  .catalogue-info .name { font-weight: 600; font-size: 0.92rem; color: var(--cream); }
  .catalogue-info .price { font-size: 0.8rem; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold-dim);
    background: transparent; color: var(--gold); font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .stepper button:active { background: var(--gold); color: var(--bg); }
  .stepper .qty { min-width: 18px; text-align: center; font-weight: 700; color: var(--cream); }

  .running-total {
    position: sticky; bottom: 76px; background: var(--surface-hi); color: var(--cream);
    border: 1px solid var(--border-bright); border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: 0.9rem;
  }
  .running-total .amount { font-size: 1.15rem; font-weight: 700; color: var(--gold); }
  .guidance-text { font-family: var(--font-quote); font-style: italic; font-size: 0.85rem; margin-top: 8px; color: var(--muted); line-height: 1.45; }

  .review-block { margin-bottom: 16px; }
  .review-block h3 { font-family: var(--font-head); font-size: 0.85rem; letter-spacing: 0.02em; color: var(--gold); margin: 0 0 6px; }
  .review-block p { margin: 0 0 4px; font-size: 0.92rem; line-height: 1.5; }
  .review-empty { color: var(--muted); font-style: italic; }

  nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface-hi); border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: space-between;
  }
  nav.bottom-nav button {
    flex: 1; padding: 14px; border-radius: 10px; border: none;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
    font-family: var(--font-body);
  }
  .btn-back { background: transparent; border: 1px solid var(--border-bright) !important; color: var(--cream); flex: 0 0 96px !important; }
  .btn-save-later { background: transparent; border: 1px solid var(--gold-dim) !important; color: var(--gold); flex: 0 0 auto !important; padding: 14px 16px; }
  .btn-next { background: var(--gold); color: #201a10; }
  .btn-next:disabled { background: var(--gold-dim); color: rgba(32,26,16,0.6); cursor: default; }
  .btn-next.saving { opacity: 0.7; }

  .center-card { text-align: center; padding: 40px 24px; }
  .center-card h2 { color: var(--cream); }
  .center-card p { color: var(--muted); line-height: 1.5; }

  .photo-note { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<header class="top">
  <p class="event-name">{{ booking.event_name }}</p>
  <p class="event-meta" id="event-meta"></p>
  <div class="progress-track" id="progress-track"></div>
  <div class="progress-label" id="progress-label"></div>
</header>

<main id="wizard-root"></main>

<nav class="bottom-nav" id="bottom-nav">
  <button class="btn-back" id="btn-back" type="button">Back</button>
  <button class="btn-save-later" id="btn-save-later" type="button">Save &amp; come back later</button>
  <button class="btn-next" id="btn-next" type="button">Next</button>
</nav>

<script type="application/json" id="bootstrap-data">{{ bootstrap_json | safe }}</script>
<script>
(function () {
  "use strict";
  var TOKEN = window.location.pathname.split("/").pop();
  var DATA = JSON.parse(document.getElementById("bootstrap-data").textContent);
  // Server-driven: the AV step only exists for Loft bookings, so the
  // sequence comes from the bootstrap rather than being hardcoded here.
  var STEPS = DATA.steps || ["basics", "food", "beverage", "music", "vendors", "extras", "review"];
  var STEP_LABELS = { basics: "The Basics", food: "Food", beverage: "Beverage", music: "Music", vendors: "Suppliers & Vendors", extras: "Extras", av: "AV & Screen", review: "Review & Approve" };

  var state = {
    stepIndex: Math.max(0, STEPS.indexOf(DATA.current_step)),
    basics: {
      start_time: (DATA.booking.start_time || "").slice(0, 5),
      end_time: (DATA.booking.end_time || "").slice(0, 5),
      food_service_time: (DATA.booking.food_service_time || "").slice(0, 5),
      setup_access_time: (DATA.booking.setup_access_time || "14:00").slice(0, 5),
      guest_arrival_time: (DATA.booking.guest_arrival_time || "").slice(0, 5),
      key_moments: (DATA.booking.key_moments || []).map(function (m) { return { time: (m.time || "").slice(0, 5), label: m.label }; }),
      adult_count: DATA.booking.adult_count,
      child_count: DATA.booking.child_count
    },
    food: DATA.responses.food || { platters: [], pizzas: [], sides: [], desserts: [] },
    beverage: DATA.responses.beverage || { bar_structure: null, bar_limit: null, bar_inclusions: null, bar_inclusions_note: null },
    vendors: (DATA.responses.vendors && DATA.responses.vendors.vendors) || [],
    vendorsSaved: !!DATA.responses.vendors,
    av: DATA.responses.av || { video_slideshow: false, microphones_for_speeches: false, notes: null },
    music: DATA.responses.music || { music_type: null, notes: null, bump_in_notes: null },
    extras: DATA.responses.extras || {
      cake_choice: { type: "none", menu_item_id: null, notes: null },
      decorations_notes: null, layout_notes: null, dietary_requirements: null,
      accessibility_needs: null, additional_notes: null
    },
    lastGuidance: null,
    lastWarnings: [],
    escalated: false,
    submitting: false
  };

  // A food response saved before sides/desserts existed lacks those keys.
  state.food.sides = state.food.sides || [];
  state.food.desserts = state.food.desserts || [];
  // A music response saved before multi-select stored a single type.
  if (!state.music.music_types) {
    state.music.music_types = state.music.music_type ? [state.music.music_type] : [];
  }

  var root = document.getElementById("wizard-root");
  var btnBack = document.getElementById("btn-back");
  var btnNext = document.getElementById("btn-next");

  document.getElementById("event-meta").innerHTML =
    DATA.booking.space_name + " · " + (DATA.booking.event_date_display || DATA.booking.event_date) +
    '<br><span class="event-ref">Ref ' + DATA.booking.reference_code + "</span>";

  function money(v) { return "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function qtyFor(list, id) { var e = list.find(function (i) { return i.menu_item_id === id; }); return e ? e.quantity : 0; }
  function setQty(list, id, qty) {
    var idx = list.findIndex(function (i) { return i.menu_item_id === id; });
    if (qty <= 0) { if (idx >= 0) list.splice(idx, 1); return; }
    if (idx >= 0) { list[idx].quantity = qty; } else { list.push({ menu_item_id: id, quantity: qty }); }
  }

  function renderProgress() {
    var track = document.getElementById("progress-track");
    track.innerHTML = "";
    STEPS.forEach(function (s, i) {
      var seg = document.createElement("div");
      seg.className = "progress-seg" + (i < state.stepIndex ? " done" : i === state.stepIndex ? " active" : "");
      track.appendChild(seg);
    });
    document.getElementById("progress-label").textContent = "Step " + (state.stepIndex + 1) + " of " + STEPS.length + " — " + STEP_LABELS[STEPS[state.stepIndex]];
  }

  function api(step, body) {
    return fetch("/w/" + TOKEN + "/" + step, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (resp) {
      return resp.json().then(function (data) {
        if (!resp.ok) { var err = new Error(data.detail || "Something went wrong"); err.status = resp.status; throw err; }
        return data;
      });
    });
  }

  // ---- BASICS ----
  function renderBasics() {
    root.innerHTML =
      '<div class="card">' +
      '<h2>Confirm the basics</h2>' +
      '<p class="step-intro">These are the details we have on file. Confirm they\'re still right, or update anything that\'s changed.</p>' +
      '<form id="basics-form">' +
      '<div class="field-row">' +
      '<div><label class="first">Event start time</label><input type="time" id="f-start" required></div>' +
      '<div><label class="first">Event finish time</label><input type="time" id="f-end" required></div>' +
      '</div>' +
      '<label>Food service time</label><input type="time" id="f-food-time" required>' +
      '<label>Set-up access time</label><input type="time" id="f-setup-time" required>' +
      '<p class="field-hint" id="setup-hint">We aim for 2:00pm access. This is a request only — the team will confirm your access time closer to the event.</p>' +
      '<label>Guest arrival time</label><input type="time" id="f-guest-arrival">' +
      '<p class="field-hint">When your guests arrive — often different from your own access time. Leave blank if it\'s the same as your arrival.</p>' +
      '<div class="field-row">' +
      '<div><label>Adults</label><input type="number" min="0" id="f-adults" required></div>' +
      '<div><label>Children</label><input type="number" min="0" id="f-children" required></div>' +
      '</div>' +
      '<p class="field-hint">Kids are welcome and never count toward the minimum guest numbers.</p>' +
      '<label>Key moments</label>' +
      '<p class="field-hint">Speeches, cake cutting, raffle draws — anything the team should be ready for.</p>' +
      '<div id="moments-list"></div>' +
      '<button type="button" class="btn-secondary" id="btn-add-moment">+ Add a moment</button>' +
      '<div id="basics-warnings"></div>' +
      '</form>' +
      '</div>';

    document.getElementById("f-start").value = state.basics.start_time || "";
    document.getElementById("f-end").value = state.basics.end_time || "";
    document.getElementById("f-food-time").value = state.basics.food_service_time || "";
    document.getElementById("f-setup-time").value = state.basics.setup_access_time || "";
    document.getElementById("f-guest-arrival").value = state.basics.guest_arrival_time || "";
    document.getElementById("f-adults").value = state.basics.adult_count;
    document.getElementById("f-children").value = state.basics.child_count;
    renderMomentRows();
    document.getElementById("btn-add-moment").addEventListener("click", function () {
      state.basics.key_moments.push({ time: "", label: "" });
      renderMomentRows();
    });
    renderBasicsWarnings();
  }

  function renderMomentRows() {
    var list = document.getElementById("moments-list");
    if (!list) return;
    list.innerHTML = "";
    state.basics.key_moments.forEach(function (moment, index) {
      var row = document.createElement("div");
      row.className = "field-row";
      row.innerHTML =
        '<div><input type="time" value="' + (moment.time || "") + '"></div>' +
        '<div style="flex:3;"><input type="text" maxlength="120" placeholder="e.g. Speeches" value="' + (moment.label || "").replace(/"/g, "&quot;") + '"></div>' +
        '<button type="button" class="btn-secondary" aria-label="Remove">×</button>';
      var inputs = row.querySelectorAll("input");
      inputs[0].addEventListener("input", function () { moment.time = inputs[0].value; });
      inputs[1].addEventListener("input", function () { moment.label = inputs[1].value; });
      row.querySelector("button").addEventListener("click", function () {
        state.basics.key_moments.splice(index, 1);
        renderMomentRows();
      });
      list.appendChild(row);
    });
  }

  function renderBasicsWarnings() {
    var box = document.getElementById("basics-warnings");
    if (!box) return;
    var html = "";
    state.lastWarnings.forEach(function (w) {
      html += '<div class="warning-banner">' + w.message + "</div>";
    });
    box.innerHTML = html;
  }

  function saveBasics() {
    var form = document.getElementById("basics-form");
    if (!form.reportValidity()) {
      // Native browser validation UI already told the client what's
      // missing -- no need for our own alert on top of it.
      return Promise.reject({ handledByBrowser: true });
    }

    state.basics.start_time = document.getElementById("f-start").value;
    state.basics.end_time = document.getElementById("f-end").value;
    state.basics.food_service_time = document.getElementById("f-food-time").value;
    state.basics.setup_access_time = document.getElementById("f-setup-time").value;
    state.basics.guest_arrival_time = document.getElementById("f-guest-arrival").value || null;
    state.basics.adult_count = parseInt(document.getElementById("f-adults").value || "0", 10);
    state.basics.child_count = parseInt(document.getElementById("f-children").value || "0", 10);

    return api("basics", {
      start_time: state.basics.start_time, end_time: state.basics.end_time,
      food_service_time: state.basics.food_service_time, setup_access_time: state.basics.setup_access_time,
      guest_arrival_time: state.basics.guest_arrival_time || null,
      key_moments: state.basics.key_moments
        .filter(function (m) { return (m.label || "").trim(); })
        .map(function (m) { return { time: m.time || null, label: m.label.trim() }; }),
      adult_count: state.basics.adult_count, child_count: state.basics.child_count
    }).then(function (data) {
      state.lastWarnings = data.warnings || [];
    });
  }

  // ---- FOOD ----
  var foodSaveTimer = null;

  // Sourced from the real photos on meantime.com.au/functions.html (matched
  // by name, verified via each image's alt text -- not guessed). Two
  // current catalogue items have no photo on the live site yet (Shoestring
  // Fries, Vegetarian Pizza -- both newer/less-common additions): they fall
  // through to the placeholder tile below rather than reusing an unrelated
  // photo. Cake photos are real Meantime photography, served locally from
  // app/static/menu_images (see app/main.py's StaticFiles mount) rather
  // than the live site, since they aren't published there.
  var PHOTO_MAP = {
    "Pork Belly Bites": "https://meantime.com.au/images/pork-belly-bites.jpg",
    "Chicken Tender Skewers": "https://meantime.com.au/images/chicken-tender-skewers.jpg",
    "Ricotta & Sun-dried Tomato Stuffed Mushrooms": "https://meantime.com.au/images/ricotta-mushrooms.jpg",
    "Salt & Pepper Squid": "https://meantime.com.au/images/salt-pepper-squid.jpg",
    "Mushroom & Feta Arancini": "https://meantime.com.au/images/mushroom-arancini.jpg",
    "Crispy Popcorn Halloumi": "https://meantime.com.au/images/halloumi.jpg",
    "Pork & Fennel Meatballs": "https://meantime.com.au/images/meatballs.jpg",
    "Grazing Platter": "https://meantime.com.au/images/grazing-platter.jpg",
    "Margherita Pizza": "https://meantime.com.au/images/pizza-margherita.jpg",

  // Marker chips as published on the website menu. Items with no
  // confirmed marker simply show none -- never guessed. P renders only
  // where an item actually contains peanuts (none on the function menu).
  var MARKER_TITLES = { V: "Vegetarian", VG: "Vegan", DF: "Dairy Free", DFA: "Dairy Free Available", P: "Contains peanuts" };

  function markerChips(item) {
    if (!item.markers || !item.markers.length) return "";
    return item.markers.map(function (m) {
      return '<span class="marker-chip' + (m === "P" ? " peanut" : "") + '" title="' + (MARKER_TITLES[m] || m) + '">' + m + "</span>";
    }).join("");
  }

  function catalogueRow(item, list) {
    var qty = qtyFor(list, item.id);
    var row = document.createElement("div");
    row.className = "catalogue-item";
    var photoUrl = PHOTO_MAP[item.name];
    var photoHtml = photoUrl
      ? '<img class="catalogue-photo" src="' + photoUrl + '" alt="' + item.name + '" onerror="this.outerHTML=\'<div class=&quot;catalogue-photo placeholder&quot;>' + item.name.split(" ").slice(0, 2).join(" ") + '</div>\'">'
      : '<div class="catalogue-photo placeholder">' + item.name.split(" ").slice(0, 2).join(" ") + '</div>';
    row.innerHTML =
      photoHtml +
      '<div class="catalogue-info"><div class="name">' + item.name + " " + markerChips(item) + '</div><div class="price">' + money(item.price) + " each</div></div>" +
      '<div class="stepper"><button type="button" data-act="minus">−</button><span class="qty">' + qty + '</span><button type="button" data-act="plus">+</button></div>';
    var qtySpan = row.querySelector(".qty");
    row.querySelector('[data-act="minus"]').addEventListener("click", function () {
      var q = Math.max(0, qtyFor(list, item.id) - 1);
      setQty(list, item.id, q);
      qtySpan.textContent = q;
      onFoodChanged();
    });
    row.querySelector('[data-act="plus"]').addEventListener("click", function () {
      var q = qtyFor(list, item.id) + 1;
      setQty(list, item.id, q);
      qtySpan.textContent = q;
      onFoodChanged();
    });
    return row;
  }

  function computeLocalFoodTotal() {
    var total = 0;
    function priceOf(list, id) { var m = (list || []).find(function (i) { return i.id === id; }); return m ? parseFloat(m.price) : 0; }
    state.food.platters.forEach(function (e) { total += priceOf(DATA.catalogue.platters, e.menu_item_id) * e.quantity; });
    state.food.pizzas.forEach(function (e) { total += priceOf(DATA.catalogue.pizzas, e.menu_item_id) * e.quantity; });
    state.food.sides.forEach(function (e) { total += priceOf(DATA.catalogue.sides, e.menu_item_id) * e.quantity; });
    state.food.desserts.forEach(function (e) { total += priceOf(DATA.catalogue.desserts, e.menu_item_id) * e.quantity; });
    return total;
  }

  function updateFoodTotalDisplay() {
    var el = document.getElementById("food-total");
    if (el) el.textContent = money(computeLocalFoodTotal());
  }

  function onFoodChanged() {
    updateFoodTotalDisplay();
    clearTimeout(foodSaveTimer);
    foodSaveTimer = setTimeout(function () {
      saveFood().catch(function () { /* saved on Next regardless */ });
    }, 600);
  }

    return api("food", {

    var savedInclusions = state.beverage.bar_inclusions;
    var checkedKeys = Array.isArray(savedInclusions) ? savedInclusions : [];

  // ---- EXTRAS ----

  // Cakes offered at more than one size (currently Vanilla/Chocolate, each
  // at 2/3/4 layer) are separate MenuItem rows -- each size is genuinely a
  // different priced product -- but showing three near-identical photo
  // cards for the same cake reads as three different cakes. Grouped here
  // by stripping a trailing "(N Layer)" so they render as one card with a
  // size picker instead; a cake with only one size (Chocolate Mud Cake,
  // Tiramisu, etc.) still renders as a single plain card, unchanged.
  var LAYER_SUFFIX_RE = /^(.*) \((\d+) Layer\)$/;

  function groupCakesBySize(cakes) {
    var order = [];
    var groups = {};
    cakes.forEach(function (c) {
      var m = c.name.match(LAYER_SUFFIX_RE);
      var baseName = m ? m[1] : c.name;
      var layer = m ? parseInt(m[2], 10) : null;
      if (!groups[baseName]) { groups[baseName] = { name: baseName, variants: [] }; order.push(baseName); }
      groups[baseName].variants.push({ id: c.id, layer: layer, price: c.price, fullName: c.name });
    });
    order.forEach(function (baseName) {
      groups[baseName].variants.sort(function (a, b) { return (a.layer || 0) - (b.layer || 0); });
    });
    return order.map(function (baseName) { return groups[baseName]; });
  }

  function cakePhotoHtml(displayName, lookupName) {
    var photoUrl = PHOTO_MAP[lookupName];
    return photoUrl
      ? '<img class="catalogue-photo" src="' + photoUrl + '" alt="' + displayName + '" onerror="this.outerHTML=\'<div class=&quot;catalogue-photo placeholder&quot;>' + displayName.split(" ").slice(0, 2).join(" ") + '</div>\'">'
      : '<div class="catalogue-photo placeholder">' + displayName.split(" ").slice(0, 2).join(" ") + '</div>';
  }

  function renderCakeGroup(group) {
    var photoHtml = cakePhotoHtml(group.name, group.variants[0].fullName);
    if (group.variants.length === 1) {
      var only = group.variants[0];
      return '<div class="option-card option-card-photo" data-cake-id="' + only.id + '">' + photoHtml +
        '<div><div class="opt-title">' + group.name + '</div><div class="opt-desc">' + money(only.price) + '</div></div></div>';
    }
    var pills = group.variants.map(function (v) {
      return '<button type="button" class="layer-pill" data-cake-id="' + v.id + '">' + v.layer + ' Layer &middot; ' + money(v.price) + '</button>';
    }).join("");
    return '<div class="option-card option-card-photo cake-group">' + photoHtml +
      '<div><div class="opt-title">' + group.name + '</div><div class="layer-options">' + pills + '</div></div></div>';
  }

  function renderVendorRows() {
    var list = document.getElementById("vendor-list");

      // A stacked card per vendor with full-width labelled fields -- the

      // (unlabelled collapsed select, truncated inputs).
      var card = document.createElement("div");
      card.className = "vendor-card";
      var options = VENDOR_TYPES.map(function (t) {
        return '<option value="' + t.key + '"' + (vendor.vendor_type === t.key ? " selected" : "") + '>' + t.label + "</option>";

      inputs[1].addEventListener("input", function () { vendor.contact_number = inputs[1].value; });
      inputs[2].addEventListener("input", function () { vendor.bump_in_time = inputs[2].value; });

        state.vendors.splice(index, 1);

  function saveVendors() {
    var vendors = state.vendors
      .filter(function (v) { return (v.name || "").trim(); })
      .map(function (v) {
        return {
          vendor_type: v.vendor_type, name: v.name.trim(),
          contact_number: (v.contact_number || "").trim() || null,
          bump_in_time: v.bump_in_time || null
        };
      });
    return api("vendors", { vendors: vendors }).then(function () {
      state.vendorsSaved = true;
    });
  }

  // ---- AV (The Loft only -- this step isn't in STEPS for other spaces) ----
  function renderAv() {
    var deadline = DATA.policy.av_usb_deadline_display;
    root.innerHTML =
      '<div class="card"><h2>AV &amp; screen</h2>' +
      '<p class="step-intro">The Loft has a large screen available for your event.</p>' +
      '<label class="check-row"><input type="checkbox" id="f-av-video"> We\'ll have a video or photo slideshow</label>' +
      '<div class="info-banner">Video must be on a <b>USB flash drive</b> — phones and laptops can\'t connect to the venue screen.' +
      (deadline ? ' Drop the USB in by <b>' + deadline + '</b> so we can test it.' : '') + '</div>' +
      '<label class="check-row"><input type="checkbox" id="f-av-mics"> We\'ll need microphones for speeches</label>' +
      '<label>Notes</label><textarea id="f-av-notes" placeholder="Anything else about AV"></textarea>' +
      "</div>";
    document.getElementById("f-av-video").checked = !!state.av.video_slideshow;
    document.getElementById("f-av-mics").checked = !!state.av.microphones_for_speeches;
    document.getElementById("f-av-notes").value = state.av.notes || "";
  }

  function saveAv() {
    state.av.video_slideshow = document.getElementById("f-av-video").checked;
    state.av.microphones_for_speeches = document.getElementById("f-av-mics").checked;
    state.av.notes = document.getElementById("f-av-notes").value || null;
    return api("av", state.av);
  }

  // ---- REVIEW ----
  function reviewLine(label, value) {
    return '<p><strong>' + label + ':</strong> ' + (value ? value : '<span class="review-empty">Not provided</span>') + "</p>";
  }

  function renderReview() {
    var foodLines = "";
    // Line totals per item, matching the Event Order's own format --
    // a client checking their order can see what each line costs.
    function itemOf(list, id) { return (list || []).find(function (i) { return i.id === id; }); }
    function foodLine(list, entry) {
      var item = itemOf(list, entry.menu_item_id);
      if (!item) return "<p>" + entry.quantity + "× " + entry.menu_item_id + "</p>";
      return "<p>" + entry.quantity + "× " + item.name + ": " + money(entry.quantity * parseFloat(item.price)) + "</p>";
    }
    state.food.platters.forEach(function (e) { foodLines += foodLine(DATA.catalogue.platters, e); });
    state.food.pizzas.forEach(function (e) { foodLines += foodLine(DATA.catalogue.pizzas, e); });
    state.food.sides.forEach(function (e) { foodLines += foodLine(DATA.catalogue.sides, e); });
    state.food.desserts.forEach(function (e) { foodLines += foodLine(DATA.catalogue.desserts, e); });
    if (!foodLines) foodLines = '<p class="review-empty">Nothing selected</p>';

    var vendorLines = "";
    state.vendors.forEach(function (v) {
      if (!(v.name || "").trim()) return;
      vendorLines += "<p>" + v.vendor_type + ": " + v.name +
        (v.bump_in_time ? " — requested bump-in " + v.bump_in_time : "") + "</p>";
    });
    if (!vendorLines) vendorLines = '<p class="review-empty">No vendors</p>';

    var avBlock = "";
    if (STEPS.indexOf("av") >= 0) {
      avBlock = '<div class="review-block"><h3>AV &amp; Screen</h3>' +
        reviewLine("Video/slideshow", state.av.video_slideshow ? "Yes (USB)" : "No") +
        reviewLine("Microphones", state.av.microphones_for_speeches ? "Yes" : "No") +
        "</div>";
    }

    var momentsText = state.basics.key_moments
      .filter(function (m) { return (m.label || "").trim(); })
      .map(function (m) { return (m.time ? m.time + " " : "") + m.label; })
      .join("; ") || null;

    var bevLabel = { cash_bar: "Cash bar", bar_tab: "Bar tab", hybrid: "Hybrid" }[state.beverage.bar_structure] || null;

    root.innerHTML =
      '<div class="card">' +
      '<h2>Review &amp; approve</h2>' +
      '<p class="step-intro">Check everything below, then approve to send this through.</p>' +
      '<div class="review-block"><h3>Basics</h3>' +
      reviewLine("Arrival", state.basics.start_time) + reviewLine("Finish", state.basics.end_time) +
      reviewLine("Food service", state.basics.food_service_time) + reviewLine("Set-up access", state.basics.setup_access_time) +
      reviewLine("Guests", state.basics.adult_count + " adults, " + state.basics.child_count + " children") +
      reviewLine("Guest arrival", state.basics.guest_arrival_time) +
      reviewLine("Key moments", momentsText) +
      "</div>" +
      '<div class="review-block"><h3>Food</h3>' + foodLines + '<p><strong>Running total: </strong>' + money(computeLocalFoodTotal()) + "</p></div>" +
      '<div class="review-block"><h3>Beverage</h3>' + reviewLine("Structure", bevLabel) +
      (state.beverage.bar_limit ? reviewLine("Limit", money(state.beverage.bar_limit)) : "") + "</div>" +
      '<div class="review-block"><h3>Music</h3>' + reviewLine("Type", state.music.music_types.map(function (t) {
        return { own_playlist: "Own playlist", dj: "DJ", musician: "Musician" }[t] || t;
      }).join(", ") || null) + "</div>" +
      '<div class="review-block"><h3>Suppliers &amp; Vendors</h3>' + vendorLines + "</div>" +
      avBlock +
      '<div class="review-block"><h3>Extras</h3>' +
      reviewLine("Cake", state.extras.cake_choice.type === "none" ? "None" : state.extras.cake_choice.type === "outside" ? "Bringing own (GF)" : "In-house") +
      reviewLine("Dietary requirements", state.extras.dietary_requirements) +
      reviewLine("Accessibility", state.extras.accessibility_needs) +
      "</div>" +
      '<div class="review-block"><h3>Anything else we should know?</h3>' +
      '<textarea id="f-final-notes" placeholder="Anything the form didn\'t ask about"></textarea></div>' +
      '<div id="review-result"></div>' +
      "</div>";
    document.getElementById("f-final-notes").value = state.finalNotes || "";
    document.getElementById("f-final-notes").addEventListener("input", function (e) { state.finalNotes = e.target.value; });
  }

  function submitReview() {
    // submit_review() (server) sets the session to "submitted" in the same
    // transaction as this call succeeding -- reloading now serves
    // wizard/submitted.html, the real "you're done" confirmation page
    // (see GET /w/{token}), instead of hand-rolling a second, thinner
    // version of that same state in place here. A client landing on a
    // half-empty card with the button simply gone read as broken, not
    // finished -- see the incident this fixed.
    return api("review", { final_notes: state.finalNotes || null }).then(function () {
      window.location.reload();
    });
  }

  var RENDERERS = { basics: renderBasics, food: renderFood, beverage: renderBeverage, music: renderMusic, vendors: renderVendors, extras: renderExtras, av: renderAv, review: renderReview };
  var SAVERS = { basics: saveBasics, food: saveFood, beverage: saveBeverage, music: saveMusic, vendors: saveVendors, extras: saveExtras, av: saveAv, review: submitReview };

  function renderStep() {
    renderProgress();
    var step = STEPS[state.stepIndex];
    RENDERERS[step]();
    btnBack.style.visibility = state.stepIndex === 0 ? "hidden" : "visible";
    btnNext.textContent = step === "review" ? "Approve & Submit" : "Next";
    btnNext.disabled = false;
    btnNext.classList.remove("saving");
  }

  btnBack.addEventListener("click", function () {
    if (state.stepIndex === 0) return;
    state.stepIndex -= 1;
    renderStep();
  });

  btnNext.addEventListener("click", function () {
    var step = STEPS[state.stepIndex];
    btnNext.disabled = true;
    btnNext.classList.add("saving");
    SAVERS[step]().then(function () {
      if (step === "basics") { renderBasicsWarnings(); }
      if (step !== "review") {
        state.stepIndex = Math.min(state.stepIndex + 1, STEPS.length - 1);
        renderStep();
      } else {
        btnNext.style.display = "none";
      }
      btnNext.disabled = false;
      btnNext.classList.remove("saving");
    }).catch(function (err) {
      btnNext.disabled = false;
      btnNext.classList.remove("saving");
      if (err && err.handledByBrowser) return;
      alert(err.message || "Couldn't save that — please try again.");
    });
  });

  // ---- SAVE & COME BACK LATER ----
  // Saves the current step first (nothing typed is lost), then shows a
  // panel carrying the SAME information as the resume email -- due date
  // as an absolute date, the link itself, and the help address -- because
  // clients frequently don't check email straight away, and a panel that
  // just said "saved" would strand them.
  var btnSaveLater = document.getElementById("btn-save-later");
  btnSaveLater.addEventListener("click", function () {
    var step = STEPS[state.stepIndex];
    btnSaveLater.disabled = true;
    var saveCurrent = step === "review" ? Promise.resolve() : SAVERS[step]().catch(function (err) {
      // An incomplete step (browser validation, nothing selected yet)
      // must not block stepping away -- their earlier steps are saved.
      if (err && err.handledByBrowser) return;
    });
    saveCurrent.then(function () {
      return fetch("/w/" + TOKEN + "/save-for-later", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
        .then(function (resp) { return resp.json(); });
    }).then(function (data) {
      document.getElementById("bottom-nav").style.display = "none";
      root.innerHTML =
        '<div class="card center-card">' +
        '<h2>Saved — come back any time</h2>' +
        '<p>Everything you\'ve entered so far is safe.</p>' +
        (data.email_sent
          ? '<p>We\'ve emailed your link to <b>' + (data.contact_email || "you") + '</b>.</p>'
          : '<p>Keep this link to pick up where you left off:</p>') +
        '<p style="word-break:break-all;"><a href="' + data.resume_url + '" style="color:var(--gold);">' + data.resume_url + "</a></p>" +
        (data.due_date_display ? '<p><b>Please complete this by ' + data.due_date_display + '.</b></p>' : "") +
        '<p>Any questions, email <a href="mailto:' + data.help_email + '" style="color:var(--gold);">' + data.help_email + "</a>.</p>" +
        "</div>";
    }).catch(function () {
      btnSaveLater.disabled = false;
      alert("Couldn't save right now — please try again.");
    });
  });

  renderStep();
})();
</script>
</body>
</html>
