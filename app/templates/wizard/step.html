<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ booking.event_name }} — Event Details</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f5f5f3; margin: 0; padding: 24px 16px; color: #2b2b2b; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 1.1rem; margin: 0 0 4px; }
    .step-label { color: #6b6b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 16px; }
    pre { background: #f0f0ee; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
    .note { color: #6b6b6b; font-size: 0.85rem; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ booking.event_name }}</h1>
    <div class="step-label">Step: {{ current_step }}</div>
    <pre>{{ step_data }}</pre>
    <p class="note">This is a placeholder screen — the branded, image-led step-by-step experience is built in a later phase. This page exists to prove the token/session plumbing works end to end.</p>
  </div>
</body>
</html>
