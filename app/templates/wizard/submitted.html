<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ booking.event_name }} — Details Submitted</title>
  <style>
    :root { --charcoal: #2a2723; --cream: #f7f2e7; --wine: #6d2438; --wine-deep: #531b2b; --gold: #b4893f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--cream); margin: 0; padding: 40px 16px; color: var(--charcoal); }
    .card { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 32px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; }
    h1 { font-size: 1.2rem; margin: 0 0 10px; color: var(--wine-deep); }
    p { color: #4a453e; line-height: 1.5; }
    .ref { display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 999px; background: var(--cream); color: var(--gold); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks — your details are in</h1>
    <p>We've received your event details for {{ booking.event_name }}. Your Event Order and final invoice will follow shortly.</p>
    <span class="ref">Ref {{ booking.reference_code }}</span>
  </div>
</body>
</html>
