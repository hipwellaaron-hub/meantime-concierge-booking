<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ booking.event_name }} — Details Submitted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0e; --surface: #161616; --gold: #c9a96e; --gold-dim: #a08350;
      --cream: #f5f0e8; --muted: #8a8580; --border: rgba(201,169,110,0.15); --border-bright: rgba(201,169,110,0.35);
    }
    body { font-family: "DM Sans", -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 40px 16px; color: var(--cream); }
    .card { max-width: 460px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 36px 24px; text-align: center; }
    h1 { font-family: "Playfair Display", Georgia, serif; font-size: 1.3rem; margin: 0 0 10px; color: var(--cream); font-weight: 600; }
    p { color: var(--muted); line-height: 1.55; }
    .ref { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border-bright); color: var(--gold); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks — your details are in</h1>
    <p>We've received your event details for {{ booking.event_name }}. Your Event Order and final invoice will follow shortly.</p>
    <span class="ref">Ref {{ booking.reference_code }}</span>
  </div>
</body>
</html>
